<!doctype html>
<html lang="en">

    <title>GuardianScan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1>GuardianScan</h1>
